<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CallTourAI — Voice RAG</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0; background: #0b1220; color: #e5e7eb;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 56px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 8px 0; color: #a7b0c0; }
    .card {
      margin-top: 18px;
      background: #0f1a2f;
      border: 1px solid #20304f;
      border-radius: 12px;
      padding: 16px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #334155; }
    button.danger { background: #dc2626; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0b2a54;
      border: 1px solid #1f3c62;
      color: #c7d2fe;
      font-size: 12px;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    textarea {
      width: 100%; min-height: 110px;
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid #20304f;
      background: #0b1220;
      color: #e5e7eb;
      resize: vertical;
      box-sizing: border-box;
    }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .small { font-size: 12px; color: #9aa6bb; }
    .log {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #20304f;
      background: #0b1220;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CallTourAI — Browser Mic → Whisper → RAG</h1>
    <p>
      Use this when WSL can't see your microphone devices. The browser records audio, uploads a WAV to the backend,
      then you get transcript + RAG answer.
    </p>

    <div class="card">
      <div class="row">
        <span class="pill" id="status">Idle</span>
        <span class="pill mono" id="info">sampleRate=?</span>
      </div>
      <div class="row" style="margin-top: 12px;">
        <button id="btnStart">Start recording</button>
        <button id="btnStop" class="danger" disabled>Stop</button>
        <button id="btnSend" class="secondary" disabled>Send to RAG</button>
        <span class="small">Tip: Microphone permission is required.</span>
      </div>

      <div class="grid" style="margin-top: 14px;">
        <div>
          <div class="small">Transcript</div>
          <textarea id="transcript" placeholder="(transcript appears here)" spellcheck="false"></textarea>
        </div>
        <div>
          <div class="small">RAG Answer</div>
          <textarea id="answer" placeholder="(answer appears here)" spellcheck="false"></textarea>
        </div>
      </div>

      <div class="log mono" id="log"></div>
    </div>
  </div>

<script>
  const statusEl = document.getElementById('status');
  const infoEl = document.getElementById('info');
  const logEl = document.getElementById('log');
  const transcriptEl = document.getElementById('transcript');
  const answerEl = document.getElementById('answer');

  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnSend = document.getElementById('btnSend');

  function log(msg) {
    const t = new Date().toISOString().slice(11, 19);
    logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
  }

  // Minimal WAV encoder (16-bit PCM) + simple downsample.
  function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
    if (outputSampleRate === inputSampleRate) return buffer;
    const sampleRateRatio = inputSampleRate / outputSampleRate;
    const newLength = Math.round(buffer.length / sampleRateRatio);
    const result = new Float32Array(newLength);
    let offsetResult = 0;
    let offsetBuffer = 0;
    while (offsetResult < result.length) {
      const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
      let accum = 0, count = 0;
      for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
        accum += buffer[i];
        count++;
      }
      result[offsetResult] = accum / count;
      offsetResult++;
      offsetBuffer = nextOffsetBuffer;
    }
    return result;
  }

  function floatTo16BitPCM(output, offset, input) {
    for (let i = 0; i < input.length; i++, offset += 2) {
      let s = Math.max(-1, Math.min(1, input[i]));
      s = s < 0 ? s * 0x8000 : s * 0x7FFF;
      output.setInt16(offset, s, true);
    }
  }

  function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  function encodeWAV(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true); // PCM
    view.setUint16(20, 1, true); // PCM
    view.setUint16(22, 1, true); // mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true); // byte rate
    view.setUint16(32, 2, true); // block align
    view.setUint16(34, 16, true); // bits
    writeString(view, 36, 'data');
    view.setUint32(40, samples.length * 2, true);
    floatTo16BitPCM(view, 44, samples);

    return new Blob([view], { type: 'audio/wav' });
  }

  let audioContext = null;
  let mediaStream = null;
  let processor = null;
  let input = null;
  let chunks = [];
  let wavBlob = null;

  async function startRecording() {
    transcriptEl.value = '';
    answerEl.value = '';
    wavBlob = null;
    chunks = [];

    statusEl.textContent = 'Requesting mic…';

    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    infoEl.textContent = `sampleRate=${audioContext.sampleRate}`;

    input = audioContext.createMediaStreamSource(mediaStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = (e) => {
      const channelData = e.inputBuffer.getChannelData(0);
      chunks.push(new Float32Array(channelData));
    };

    input.connect(processor);
    processor.connect(audioContext.destination);

    statusEl.textContent = 'Recording';
    btnStart.disabled = true;
    btnStop.disabled = false;
    btnSend.disabled = true;
    log('Recording started');
  }

  function stopRecording() {
    if (!audioContext) return;

    processor.disconnect();
    input.disconnect();

    mediaStream.getTracks().forEach(t => t.stop());
    audioContext.close();

    // Concatenate chunks
    let totalLength = chunks.reduce((acc, c) => acc + c.length, 0);
    const buffer = new Float32Array(totalLength);
    let offset = 0;
    for (const c of chunks) {
      buffer.set(c, offset);
      offset += c.length;
    }

    const targetRate = 16000;
    const downsampled = downsampleBuffer(buffer, audioContext.sampleRate, targetRate);
    wavBlob = encodeWAV(downsampled, targetRate);

    statusEl.textContent = `Stopped (${Math.round(downsampled.length / targetRate)}s)`;
    btnStart.disabled = false;
    btnStop.disabled = true;
    btnSend.disabled = false;
    log(`Recording stopped; WAV bytes=${wavBlob.size}`);

    audioContext = null;
    mediaStream = null;
    processor = null;
    input = null;
  }

  async function sendToRag() {
    if (!wavBlob) {
      log('No audio recorded');
      return;
    }
    statusEl.textContent = 'Uploading…';
    btnSend.disabled = true;

    const form = new FormData();
    form.append('audio', wavBlob, 'clip.wav');

    const resp = await fetch('/api/voice_rag', { method: 'POST', body: form });
    const data = await resp.json();

    if (!resp.ok) {
      statusEl.textContent = 'Error';
      btnSend.disabled = false;
      log(`Error: ${data.error || resp.statusText}`);
      return;
    }

    const asText = (v) => {
      if (v === null || v === undefined) return '';
      if (typeof v === 'string') return v;
      try { return JSON.stringify(v, null, 2); } catch { return String(v); }
    };

    transcriptEl.value = asText(data.transcript);
    answerEl.value = asText(data.answer);
    statusEl.textContent = 'Done';
    btnSend.disabled = false;
    log('Received transcript + answer');
  }

  btnStart.addEventListener('click', () => startRecording().catch(err => {
    statusEl.textContent = 'Mic error';
    log(String(err));
  }));
  btnStop.addEventListener('click', () => stopRecording());
  btnSend.addEventListener('click', () => sendToRag().catch(err => {
    statusEl.textContent = 'Error';
    log(String(err));
    btnSend.disabled = false;
  }));
</script>
</body>
</html>
